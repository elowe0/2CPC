<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="2CPC">
<title>{{TITLE}}</title>
{{FAVICON}}
<style>{{CSS}}</style>
{{MERMAID}}
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="home" href="../../index.html" data-i18n-title="dashTip" aria-label="dashboard"><img src="../../dashboard.png" alt="" width="32" height="32" onerror="this.replaceWith(document.createTextNode('▦'))"><span data-i18n="dashBtn"></span></a>
    <div class="ttl">
      <h1>{{ICON}}{{TITLE}}</h1>
      <div class="meta"><span>{{META_LINE}}</span><nav class="versions" aria-label="versions">{{VERSIONS}}</nav></div>
    </div>
    <div class="status">
      <div class="prog"><div class="bar"><i id="progBar"></i></div><span id="progTxt"></span><span id="reqTxt" class="req-txt"></span></div>
      <span id="saveState" class="save"></span>
    </div>
    <div class="actions">
      <button type="button" id="btnAnswer" class="btn primary" data-i18n="genAnswer" data-i18n-title="genAnswerTip"></button>
      <button type="button" id="btnDelta" class="btn" data-i18n="genDelta" data-i18n-title="genDeltaTip" hidden></button>
      <button type="button" id="btnContext" class="btn" data-i18n="genContext" data-i18n-title="genContextTip"></button>
      <details class="more">
        <summary class="btn icon" aria-label="menu">⋯</summary>
        <div class="menu">
          <button type="button" id="btnExport" data-i18n="export"></button>
          <label class="file"><span data-i18n="import"></span><input type="file" id="fileImport" accept=".json,application/json"></label>
          <button type="button" id="btnReset" class="danger" data-i18n="reset"></button>
          <div class="langs"><button type="button" data-lang="fr">FR</button><button type="button" data-lang="en">EN</button></div>
        </div>
      </details>
    </div>
  </div>
</header>
<div class="layout">
  <nav class="toc" aria-label="toc">
    <div class="toc-tools"><input type="search" id="search" data-i18n-ph="searchPh" data-i18n-title="searchTip">
      <label class="only-open"><input type="checkbox" id="onlyOpen"> <span data-i18n="onlyOpen"></span></label></div>
    <div class="toc-t" data-i18n="toc"></div><ul>{{TOC}}</ul></nav>
  <main id="plan">
    <div id="reusedBanner" class="callout note" hidden><span class="ic">↻</span><div></div></div>
    {{CHANGES}}
    {{BODY}}
    {{NEXT}}
    <div class="end-actions">
      <button type="button" class="btn primary" data-act="answer" data-i18n="genAnswer"></button>
      <button type="button" class="btn" data-act="delta" data-i18n="genDelta" hidden></button>
      <button type="button" class="btn" data-act="context" data-i18n="genContext"></button>
    </div>
  </main>
</div>
<dialog id="outDlg">
  <form method="dialog">
    <p id="outMsg"></p>
    <textarea id="outTxt" rows="12" readonly></textarea>
    <div class="dlg-act"><button class="btn primary" data-i18n="close"></button></div>
  </form>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script>window.PLAN={{PLAN}};window.I18N={{I18N}};</script>
<script>{{ANSWERS_JS}}</script>
<script>{{JS}}</script>
</body>
</html>
